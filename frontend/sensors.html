<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giám sát cảm biến — IoT Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="shell">
    <!-- Thanh điều hướng bên trái (Sidebar) -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="M20 12h2"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
            <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path>
            <path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path>
          </svg>
        </div>
        <div>
          <strong>IoT Control</strong>
          <small id="sidebar-mode-label">DỮ LIỆU THỰC</small>
        </div>
        <button type="button" id="mobile-close-btn" class="mobile-close" aria-label="Đóng menu">✕</button>
      </div>

      <nav>
        <a href="/" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
          </svg>
          <span>Tổng quan</span>
        </a>

        <a href="/sensors.html" class="nav-item nav-active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Giám sát cảm biến</span>
          <span class="active-bar"></span>
        </a>

        <a href="/history.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l4 2"></path>
          </svg>
          <span>Lịch sử hoạt động</span>
        </a>

        <a href="/profile.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="5"></circle>
            <path d="M20 21a8 8 0 0 0-16 0"></path>
          </svg>
          <span>Hồ sơ cá nhân</span>
        </a>
      </nav>
    </aside>

    <div id="mobile-overlay" class="mobile-overlay" style="display: none;"></div>

    <!-- Nội dung chính -->
    <main class="main">
      <div class="mobile-bar">
        <button type="button" id="mobile-open-btn" class="hamburger" aria-label="Mở menu">☰</button>
        <strong>IoT Control</strong>
      </div>

      <div class="content">
        <section class="card records">
          <div class="section-head">
            <div>
              <h2>Dữ liệu cảm biến</h2>
              <p id="records-summary">0 giá trị cảm biến phù hợp</p>
            </div>
          </div>

          <form id="filter-form" class="filter-panel">
            <div class="filter-grid">
              <label>
                Loại cảm biến
                <select id="filter-type">
                  <option value="">Tất cả cảm biến</option>
                  <option value="temperature">Nhiệt độ</option>
                  <option value="humidity">Độ ẩm</option>
                  <option value="light">Ánh sáng</option>
                </select>
              </label>

              <label>
                Giá trị
                <input id="filter-value" placeholder="26.1 °C, 64 %, SÁNG, TỐI" />
              </label>

              <label>
                Tìm thời gian
                <input
                  id="filter-time"
                  placeholder="dd/mm/yyyy hh/mm/ss"
                  pattern="[0-9]{2}/[0-9]{2}/[0-9]{4} [0-9]{2}/[0-9]{2}/[0-9]{2}"
                  title="Ví dụ: 28/10/2026 16/40/38"
                />
              </label>
            </div>

            <div class="button-row">
              <button type="submit" class="btn primary">Tìm kiếm</button>
              <button type="button" id="btn-reset" class="btn outline">Xóa bộ lọc</button>
              <button type="button" id="btn-reload" class="btn outline">Tải lại</button>
            </div>
          </form>

          <div id="records-error" class="form-error" role="alert" style="display: none;"></div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Cảm biến</th>
                  <th>Loại</th>
                  <th>Giá trị</th>
                  <th>Thời gian</th>
                </tr>
              </thead>
              <tbody id="records-tbody">
                <tr>
                  <td colspan="5" class="empty">Đang tải dữ liệu…</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pager">
            <div>
              <span id="pager-info">Hiển thị 0–0 / 0</span>
              <label class="page-size">
                Số dòng
                <select id="page-limit">
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </label>
            </div>

            <div id="page-buttons" class="page-buttons"></div>
          </div>
        </section>
      </div>
    </main>

    <button type="button" id="logout-btn" class="logout-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" x2="9" y1="12" y2="12"></line>
      </svg>
      Đăng xuất
    </button>
  </div>

  <script type="module" src="/src/sensors.js"></script>
</body>
</html>
